# Insert inside the existing site server block, before location /.
# Fixed image filenames: one-hour freshness, then revalidate; never immutable.
location ^~ /images/ {
    expires off;
    etag on;
    if_modified_since exact;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
}
